<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Tomás Vargas</title>
<meta name="description" content="A log of what I read, watch, and generally a space for me to play around.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="home.css">
</head>

<body>
<main>
  <header>
    <div class="id">
      <h1>tomás vargas<span class="caret">_</span></h1>
      <p class="bio">A log of what I read, watch, and generally a space for me to play around.</p>
    </div>
    <nav>
      <a href="https://www.linkedin.com/in/tom%C3%A1s-vargas-renzi/">linkedin&nbsp;↗</a>
      <a href="https://github.com/tvrcv">github&nbsp;↗</a>
    </nav>
  </header>

  <div class="controls">
    <div class="chips">
      <button class="chip" type="button" data-kind="all" aria-pressed="true"></button>
      <button class="chip" type="button" data-kind="essay" aria-pressed="false"></button>
      <button class="chip" type="button" data-kind="book" aria-pressed="false"></button>
      <button class="chip" type="button" data-kind="video" aria-pressed="false"></button>
    </div>

    <div class="field year">
      <label for="year">year</label>
      <select id="year"></select>
    </div>

    <div class="field search">
      <span class="slash" aria-hidden="true">/</span>
      <input id="q" type="search" placeholder="filter by title or author" autocomplete="off" aria-label="Filter entries">
    </div>
  </div>

  <div class="thead">
    <button id="sort" type="button">Date <span id="arrow">↓</span></button>
    <span>Title</span>
    <span class="h-by">Author</span>
    <span class="h-meta" style="text-align:right">Description</span>
  </div>

  <div id="list"></div>

  <div id="empty">
    <p>Nothing matches that.</p>
    <button id="reset" type="button">clear filters</button>
  </div>

  <footer>
    <span id="status"></span>
    <span>press <kbd>/</kbd> to search &middot; <kbd>j k</kbd> to move &middot; <kbd>↩</kbd> to open &middot; <kbd>esc</kbd> to clear</span>
  </footer>
</main>

<script src="home.js"></script>
</body>
</html>
